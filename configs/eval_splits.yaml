    split: test
    path: data/papo/We_Math.json
    image_root: "."

  Geo3k:
    dataset_name: Geo3k
    source_dataset: geometry3k
    split: test
    path: data/papo/hiyouga_geometry3k.json
    image_root: "."

  LogicVista:
